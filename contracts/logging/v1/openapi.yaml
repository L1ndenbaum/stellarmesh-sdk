openapi: 3.1.0
info:
  title: Stellarmesh Logging API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /v1/log-events:
    post:
      operationId: ingestLogEvent
      security:
        - LoggingServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEventIngestRequest"
      responses:
        "202":
          description: 事件已进入内存队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventIngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/log-events/batch:
    post:
      operationId: ingestLogEventBatch
      security:
        - LoggingServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEventBatchIngestRequest"
      responses:
        "202":
          description: 事件已进入内存队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventIngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    LoggingServiceToken:
      type: apiKey
      in: header
      name: X-Logging-Service-Token
  schemas:
    LogEvent:
      $ref: "./log-event.schema.json"
    LogEventIngestRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/LogEvent"
    LogEventBatchIngestRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LogEvent"
    LogEventIngestResult:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: integer
          minimum: 0
    ApiEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
        timestamp:
          type: string
          format: date-time
        error_reason:
          type: string
    LogEventIngestResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LogEventIngestResult"
  responses:
    BadRequest:
      description: 请求或事件格式无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Unauthorized:
      description: 服务令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Forbidden:
      description: 令牌无权为事件中的服务标识写入日志
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    PayloadTooLarge:
      description: 请求体超过限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Unavailable:
      description: 服务队列无法继续接收事件
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
