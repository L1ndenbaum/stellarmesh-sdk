name: 发布 Python SDK

on:
  push:
    tags:
      - "sdk/python/logging/v*.*.*"
      - "sdk/python/storage/v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      distribution: ${{ steps.component.outputs.distribution }}
      artifact: ${{ steps.component.outputs.artifact }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 选择待发布组件
        id: component
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            sdk/python/logging/v*.*.*)
              package_path="sdk/python/logging"
              distribution="stellarmesh-logging"
              tag_version="${GITHUB_REF_NAME#sdk/python/logging/v}"
              ;;
            sdk/python/storage/v*.*.*)
              package_path="sdk/python/storage"
              distribution="stellarmesh-storage"
              tag_version="${GITHUB_REF_NAME#sdk/python/storage/v}"
              ;;
            *)
              echo "不支持的 Python 组件 tag：$GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "artifact=${distribution}-distributions" >> "$GITHUB_OUTPUT"

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: ${{ steps.component.outputs.package_path }}/uv.lock

      - name: 校验 tag 与包版本
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.component.outputs.package_path }}
          TAG_VERSION: ${{ steps.component.outputs.tag_version }}
        run: |
          package_version="$(python - <<'PY'
          import os
          import pathlib
          import tomllib

          path = pathlib.Path(os.environ["PACKAGE_PATH"]) / "pyproject.toml"
          with path.open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          if [ "$TAG_VERSION" != "$package_version" ]; then
            echo "tag 版本 $TAG_VERSION 与 Python 包版本 $package_version 不一致" >&2
            exit 1
          fi

      - name: 冻结同步并验证 Python 包
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.component.outputs.package_path }}
        run: |
          uv sync --project "$PACKAGE_PATH" --frozen
          uv lock --project "$PACKAGE_PATH" --check
          uv run --project "$PACKAGE_PATH" --frozen ruff check "$PACKAGE_PATH"
          uv run --project "$PACKAGE_PATH" --frozen ruff format --check "$PACKAGE_PATH"
          uv run --project "$PACKAGE_PATH" --frozen mypy "$PACKAGE_PATH"
          (
            cd "$PACKAGE_PATH"
            uv run --frozen pytest
          )
          uv pip check --python "$PACKAGE_PATH/.venv/bin/python"

      - name: 构建并检查发布制品
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.component.outputs.package_path }}
        run: |
          uv build --project "$PACKAGE_PATH" --out-dir dist
          uv run --project "$PACKAGE_PATH" --frozen twine check dist/*

      - name: 上传发布制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.component.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ needs.build.outputs.distribution }}
    permissions:
      id-token: write
    steps:
      - name: 下载发布制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: 发布到 TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.distribution }}
    permissions:
      id-token: write
    steps:
      - name: 下载发布制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
