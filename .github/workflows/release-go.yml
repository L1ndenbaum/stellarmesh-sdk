name: 验证已发布 Go Module

on:
  push:
    tags:
      - "sdk/go/v*.*.*"
      - "sdk/go/logging/v*.*.*"
      - "sdk/go/mq/kafka/v*.*.*"

permissions:
  contents: read

jobs:
  public-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出消费测试
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: 从公共代理验证 Module
        run: ./tests/go-module-consumer.sh public "$GITHUB_REF_NAME"
