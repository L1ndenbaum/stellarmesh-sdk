name: 验证已发布 Go Module

on:
  push:
    tags:
      - "sdk/go/v*.*.*"
      - "sdk/go/mq/kafka/v*.*.*"

permissions:
  contents: read

jobs:
  public-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: 解析允许发布的组件
        id: component
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            sdk/go/mq/kafka/v*.*.*)
              echo "name=kafka" >> "$GITHUB_OUTPUT"
              echo "module=github.com/L1ndenbaum/stellarmesh-sdk/sdk/go/mq/kafka" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#sdk/go/mq/kafka/}" >> "$GITHUB_OUTPUT"
              ;;
            sdk/go/v*.*.*)
              echo "name=parent" >> "$GITHUB_OUTPUT"
              echo "module=github.com/L1ndenbaum/stellarmesh-sdk/sdk/go" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#sdk/go/}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "不允许的 Go module tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

      - name: 等待公共代理收录 Module
        shell: bash
        env:
          MODULE_PATH: ${{ steps.component.outputs.module }}
          MODULE_VERSION: ${{ steps.component.outputs.version }}
        run: |
          for attempt in {1..20}; do
            if env GOWORK=off GOPRIVATE= GONOPROXY= GONOSUMDB= \
              GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
              go mod download "${MODULE_PATH}@${MODULE_VERSION}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo "公共 Go 代理未在限定时间内收录 ${MODULE_PATH}@${MODULE_VERSION}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: 从公共代理构建外部消费者
        shell: bash
        env:
          COMPONENT_NAME: ${{ steps.component.outputs.name }}
          MODULE_PATH: ${{ steps.component.outputs.module }}
          MODULE_VERSION: ${{ steps.component.outputs.version }}
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"
          go mod init example.com/stellarmesh-public-consumer
          go mod edit -go=1.24
          go mod edit -require="${MODULE_PATH}@${MODULE_VERSION}"
          case "$COMPONENT_NAME" in
            parent)
              cat > main.go <<'EOF'
          package main

          import (
              "context"
              "log/slog"

              "github.com/L1ndenbaum/stellarmesh-sdk/sdk/go/gateway"
              sharedlogging "github.com/L1ndenbaum/stellarmesh-sdk/sdk/go/logging"
              "github.com/L1ndenbaum/stellarmesh-sdk/sdk/go/objectstorage"
              "github.com/L1ndenbaum/stellarmesh-sdk/sdk/go/objectstorage/s3store"
          )

          type emitter struct{}

          func (emitter) Emit(context.Context, sharedlogging.Event) bool { return true }

          func main() {
              handler, err := sharedlogging.NewSlogHandler(emitter{}, sharedlogging.SlogHandlerConfig{Service: "consumer"})
              if err != nil {
                  panic(err)
              }
              _ = slog.New(handler)
              _ = gateway.WithAccessLogEmitter("consumer", emitter{})
              var _ objectstorage.Reader = (*s3store.Client)(nil)
          }
          EOF
              ;;
            kafka)
              cat > main.go <<'EOF'
          package main

          import (
              "context"

              stellarkafka "github.com/L1ndenbaum/stellarmesh-sdk/sdk/go/mq/kafka"
          )

          func main() {
              for _, mechanism := range []stellarkafka.SASLMechanism{
                  stellarkafka.SASLMechanismPlain,
                  stellarkafka.SASLMechanismSCRAMSHA256,
                  stellarkafka.SASLMechanismSCRAMSHA512,
              } {
                  connection, err := stellarkafka.NewConnection(stellarkafka.ConnectionConfig{
                      SecurityProtocol: stellarkafka.SecurityProtocolSASLPlaintext,
                      SASLMechanism: mechanism,
                      Username: "consumer",
                      Password: "secret",
                  })
                  if err != nil {
                      panic(err)
                  }
                  _ = connection.Dialer()
                  _ = connection.Transport()
              }
              publisher, err := stellarkafka.NewPublisher(stellarkafka.Config{})
              if err != nil {
                  panic(err)
              }
              _ = publisher.Publish(context.Background(), nil)
              _ = publisher.Check
              _ = publisher.Close()
              _ = stellarkafka.CheckTopic
              _ = stellarkafka.IsMessageTooLarge
          }
          EOF
              ;;
            *)
              echo "不允许的 Go module 组件: $COMPONENT_NAME" >&2
              exit 1
              ;;
          esac
          env GOWORK=off GOPRIVATE= GONOPROXY= GONOSUMDB= \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go mod tidy
          env GOWORK=off GOPRIVATE= GONOPROXY= GONOSUMDB= \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go run .
          if [[ "$COMPONENT_NAME" == "kafka" ]]; then
            consumer_graph="$(env GOWORK=off GOPRIVATE= GONOPROXY= GONOSUMDB= \
              GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -m all)"
            if grep -Eq 'aws-sdk-go-v2|go-chi/chi|golang-jwt|redis/go-redis' <<< "$consumer_graph"; then
              echo "Kafka-only 公共消费者引入了非 Kafka 依赖" >&2
              exit 1
            fi
          fi
