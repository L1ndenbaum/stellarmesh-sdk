name: 验证已发布 Go Module

on:
  push:
    tags:
      - "sdk/go/v*.*.*"
      - "sdk/go/gateway/v*.*.*"
      - "sdk/go/gateway/loggingadapter/v*.*.*"
      - "sdk/go/logging/v*.*.*"
      - "sdk/go/mq/kafka/v*.*.*"
      - "sdk/go/objectstorage/v*.*.*"

permissions:
  contents: read

jobs:
  public-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出消费测试
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          cache: false

      - name: 从公共代理验证 Module
        run: ./tests/go-module-consumer.sh public "$GITHUB_REF_NAME"
