name: 验证已发布 Go Module

on:
  push:
    tags:
      - "sdk/go/v*.*.*"
      - "sdk/go/gateway/v*.*.*"
      - "sdk/go/gateway/loggingadapter/v*.*.*"
      - "sdk/go/logging/v*.*.*"
      - "sdk/go/mq/kafka/v*.*.*"
      - "sdk/go/objectstorage/v*.*.*"

permissions:
  contents: read

jobs:
  public-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出消费测试
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.x"
          cache: false

      - name: 从公共代理验证 Module
        run: ./tests/go-module-consumer.sh public "$GITHUB_REF_NAME"
