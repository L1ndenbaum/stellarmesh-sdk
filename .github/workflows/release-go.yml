name: 验证已发布 Go Module

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的不可变组件 tag
        required: true
        type: string
  push:
    tags:
      - "sdk/go/v*.*.*"
      - "sdk/go/gateway/v*.*.*"
      - "sdk/go/logging/v*.*.*"
      - "sdk/go/mq/kafka/v*.*.*"
      - "sdk/go/objectstorage/v*.*.*"

permissions:
  contents: read

jobs:
  public-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出消费测试
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          cache: false

      - name: 从公共代理验证 Module
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./tests/go-module-consumer.sh public "$RELEASE_TAG"
