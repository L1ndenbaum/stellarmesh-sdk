name: 持续验证

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            sdk/go/go.sum
            sdk/go/gateway/go.sum
            sdk/go/gateway/loggingadapter/go.sum
            sdk/go/mq/kafka/go.sum
            services/logging/go.sum
            services/storage/go.sum
            sinks/logging/clickhouse/go.sum

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/storage/pyproject.toml

      - name: 安装 Python 检查依赖
        run: make bootstrap

      - name: 运行格式、静态检查与测试
        run: make verify

      - name: 运行 Go 竞态检查
        run: make race

      - name: 构建镜像并运行容器集成测试
        run: make integration
