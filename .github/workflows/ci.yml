name: 持续验证

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  changes:
    name: 识别受影响的检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      expected: ${{ steps.select.outputs.expected }}
    steps:
      - name: 检出完整提交历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 按变更路径选择作业
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: python3 tests/ci/ci_jobs.py select

  go:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['go'] == 'success'
    name: Go 模块
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            sdk/go/gateway/go.sum
            sdk/go/mq/kafka/go.sum
            sdk/go/objectstorage/go.sum
            services/storage/go.sum

      - name: 运行格式、静态、单元、竞态与隔离消费检查
        run: make go-check go-doc-check go-test go-race go-module-consumer

      - name: 验证真实 Redis Session 会话与并发
        run: make integration-session

  frontend:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['frontend'] == 'success'
    name: 前端 HTTP SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/frontend/package-lock.json

      - name: 安装前端锁定依赖
        run: make frontend-bootstrap

      - name: 安装浏览器与系统依赖
        working-directory: sdk/frontend
        run: npx playwright install --with-deps chromium

      - name: 验证类型、行为、浏览器传输和打包消费
        run: make frontend-verify

  python-logging:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['python-logging'] == 'success'
    name: Python Logging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/logging/uv.lock

      - name: 验证 Logging 包
        run: make python-logging-check python-logging-test python-logging-artifact-check

  python-storage:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['python-storage'] == 'success'
    name: Python Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/storage/uv.lock

      - name: 验证 Storage 包
        run: make python-storage-check python-storage-test python-storage-artifact-check

  shell:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['shell'] == 'success'
    name: 文档、Shell 与差异检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 验证文档链接、示例、脚本与差异格式
        run: make ci-check docs-check shell-check

  integration-storage:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['integration-storage'] == 'success'
    name: Storage 集成
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          cache-dependency-path: sdk/go/objectstorage/go.sum

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/storage/uv.lock

      - name: 构建镜像并验证 Storage 链路
        run: make integration-storage

  python-objectstorage:
    needs: changes
    if: fromJSON(needs.changes.outputs.expected)['python-objectstorage'] == 'success'
    name: Python Object Storage 与 RustFS 集成
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/objectstorage/uv.lock
      - name: 验证接口、制品与真实 RustFS
        run: make python-objectstorage-check python-objectstorage-test python-objectstorage-artifact-check python-objectstorage-consumer integration-objectstorage

  verify:
    name: 持续验证
    if: always()
    needs:
      - changes
      - go
      - frontend
      - python-logging
      - python-storage
      - python-objectstorage
      - shell
      - integration-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出验证规则
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 核对计划与实际作业结果
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tests/ci/ci_jobs.py verify
