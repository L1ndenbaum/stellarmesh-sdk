name: 持续验证

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  go:
    name: Go 模块
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            sdk/go/gateway/go.sum
            sdk/go/gateway/loggingadapter/go.sum
            sdk/go/mq/kafka/go.sum
            sdk/go/objectstorage/go.sum
            services/logging/go.sum
            services/storage/go.sum
            sinks/logging/clickhouse/go.sum

      - name: 运行格式、静态、单元、竞态与隔离消费检查
        run: make go-check go-test go-race go-module-consumer

  python-logging:
    name: Python Logging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/logging/uv.lock

      - name: 验证 Logging 包
        run: make python-logging-check python-logging-test

  python-storage:
    name: Python Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/storage/uv.lock

      - name: 验证 Storage 包
        run: make python-storage-check python-storage-test

  shell:
    name: Shell 与差异检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 验证脚本与差异格式
        run: make shell-check

  integration-logging:
    name: Logging 集成
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 构建镜像并验证 Logging 链路
        run: make integration-logging

  integration-storage:
    name: Storage 集成
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          cache-dependency-path: sdk/go/objectstorage/go.sum

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: sdk/python/storage/uv.lock

      - name: 构建镜像并验证 Storage 链路
        run: make integration-storage

  verify:
    name: 持续验证
    if: always()
    needs:
      - go
      - python-logging
      - python-storage
      - shell
      - integration-logging
      - integration-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总验证结果
        env:
          GO_RESULT: ${{ needs.go.result }}
          PYTHON_LOGGING_RESULT: ${{ needs['python-logging'].result }}
          PYTHON_STORAGE_RESULT: ${{ needs['python-storage'].result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          LOGGING_INTEGRATION_RESULT: ${{ needs['integration-logging'].result }}
          STORAGE_INTEGRATION_RESULT: ${{ needs['integration-storage'].result }}
        run: |
          if [ "$GO_RESULT" != "success" ] || \
             [ "$PYTHON_LOGGING_RESULT" != "success" ] || \
             [ "$PYTHON_STORAGE_RESULT" != "success" ] || \
             [ "$SHELL_RESULT" != "success" ] || \
             [ "$LOGGING_INTEGRATION_RESULT" != "success" ] || \
             [ "$STORAGE_INTEGRATION_RESULT" != "success" ]; then
            echo "至少一项持续验证未成功" >&2
            exit 1
          fi
          echo "全部持续验证成功"
