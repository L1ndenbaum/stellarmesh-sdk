name: 发布镜像

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            sdk/go/go.sum
            sdk/go/gateway/go.sum
            sdk/go/mq/kafka/go.sum
            services/logging/go.sum
            services/storage/go.sum
            sinks/logging/clickhouse/go.sum

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/storage/pyproject.toml

      - name: 安装 Python 检查依赖
        run: make bootstrap

      - name: 验证待发布 commit
        run: make verify && make race && make integration

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: stellarmesh-sdk/logging-service
            context: .
            file: services/logging/Dockerfile
          - image: stellarmesh-sdk/storage-service
            context: .
            file: services/storage/Dockerfile
          - image: stellarmesh-sdk/logging-clickhouse-sink
            context: .
            file: sinks/logging/clickhouse/Dockerfile
          - image: stellarmesh-sdk/logging-clickhouse-migrate
            context: sinks/logging/clickhouse
            file: sinks/logging/clickhouse/Dockerfile.migrate
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用多架构构建
        uses: docker/setup-qemu-action@v3

      - name: 初始化 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 规范化镜像命名空间
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
