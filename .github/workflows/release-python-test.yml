name: 发布 Storage Python 测试包

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk/python/storage/pyproject.toml

      - name: 校验 tag 与包版本
        shell: bash
        run: |
          package_version="$(python - <<'PY'
          import pathlib
          import tomllib

          path = pathlib.Path("sdk/python/storage/pyproject.toml")
          with path.open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "tag 版本 $tag_version 与 Python 包版本 $package_version 不一致" >&2
            exit 1
          fi

      - name: 安装构建和检查依赖
        run: >-
          python -m pip install
          -e './sdk/python/storage[dev]'
          'twine>=5,<7'

      - name: 验证 Storage Python 包
        working-directory: sdk/python/storage
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
          python -m pytest

      - name: 构建发布制品
        run: |
          python -m build sdk/python/storage --outdir dist
          python -m twine check dist/*

      - name: 上传发布制品
        uses: actions/upload-artifact@v4
        with:
          name: stellarmesh-storage-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/stellarmesh-storage
    permissions:
      id-token: write
    steps:
      - name: 下载发布制品
        uses: actions/download-artifact@v4
        with:
          name: stellarmesh-storage-distributions
          path: dist

      - name: 发布到 TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
