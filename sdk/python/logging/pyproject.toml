[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarmesh-logging"
version = "0.4.0"
description = "Safe JSON formatter for Python standard-library logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "build>=1,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "twine>=6,<7",
]

[tool.setuptools.package-data]
stellarmesh_logging = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["stellarmesh_logging"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
